name: Aggiorna menu mensa

# Pianificazione disattivata: menuchiaro.it risponde 403 ai server di GitHub.
# L'aggiornamento gira sul Mac (cartella locale/). Resta solo il lancio manuale.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aggiorna-menu
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installa dipendenze e Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Leggi il menu da Menu Chiaro
        run: node scraper/scrape.mjs

      - name: Screenshot della pagina in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostica
          path: debug/
          if-no-files-found: ignore

      - name: Salva il menu nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          if git diff --cached --quiet; then
            echo "Nessuna novità"
          else
            git commit -m "Menu aggiornato $(TZ=Europe/Rome date +%F)"
            git push
          fi
