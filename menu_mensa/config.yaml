name: Menu mensa
version: "1.0.2"
slug: menu_mensa
description: Legge ogni giorno il menu della mensa da Menu Chiaro e lo pubblica su GitHub per la skill Alexa
url: https://github.com/iperionenero/menu-mensa-alexa
arch:
  - amd64
  - aarch64
startup: application
boot: auto
homeassistant_api: true
options:
  github_token: ""
  orari:
    - "06:40"
    - "13:10"
  repository: iperionenero/menu-mensa-alexa
schema:
  github_token: password
  orari:
    - match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  repository: str
